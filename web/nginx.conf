# Web gateway ของ NoteShare (ADR-006) — เสิร์ฟหน้าเว็บและส่งต่อ API จาก origin เดียวกัน
# browser จึงเรียก /notes กับ /auth ได้ตรง ๆ โดยไม่ต้องเปิด CORS ที่ตัว service
# ADR-014: route ที่ต้อง login ถูกตรวจ token กับ auth-service (GET /auth/me) ที่นี่ก่อนส่งต่อ
# ส่วน service ยังตรวจเองซ้ำอีกชั้น (สิทธิ์ admin, เจ้าของโน้ต, edit token ตัดสินที่ service เท่านั้น)

# ตาราง route ที่ต้อง login — ชุดเดียวกับ gateway/rules.js ที่ Vercel ใช้
# src/tests/test_gateway_rules.py เทียบทั้งสองที่กับ gateway/cases.json ถ้าเพิ่ม route ใหม่ต้องแก้ทั้งสามไฟล์
# login = ต้องมี token ที่ใช้ได้ · edit = แก้/ลบโน้ต (login หรือ edit token) · open = ไม่ตรวจ
map "$request_method $uri" $gateway_rule {
    default                                       open;
    "~^POST /notes$"                              login;
    "~^GET /notes/(favorites|mine)$"              login;
    "~^(POST|DELETE) /notes/[0-9]+/favorite$"     login;
    "~^POST /notes/[0-9]+/thanks$"                login;
    "~^PUT /notes/[0-9]+/rating$"                 login;
    "~^POST /notes/[0-9]+/(reports|comments)$"    login;
    "~^DELETE /notes/[0-9]+/comments/[0-9]+$"     login;
    "~^GET /notes/[0-9]+/stats$"                  login;
    # หน้าผู้ดูแล: gateway ตรวจแค่ว่า login แล้ว notes-service ตรวจ ADMIN_USER_IDS เอง
    "~^GET /reports$"                             login;
    "~^DELETE /reports/[0-9]+(/note)?$"           login;
    "~^(PATCH|DELETE) /notes/[0-9]+$"             edit;
}

# ยกเว้นชั่วคราว: แก้/ลบด้วยรหัสแก้ไข (X-Note-Token) ยังไม่ต้อง login ให้ notes-service ตรวจรหัสเอง
# ลบบรรทัด "~^edit:." ออกเมื่อเลิกใช้ edit token
map "$gateway_rule:$http_x_note_token" $gateway_check {
    default     login;
    "~^open:"   skip;
    "~^edit:."  skip;
}

server {
    # image nginx-unprivileged รันเป็น non-root จึงฟัง port ต่ำกว่า 1024 ไม่ได้
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # notes-service รับ request ได้ถึง MAX_REQUEST_BYTES = 4 MB + 256 KB (services/notes-service/app.py)
    # ตั้งที่นี่ให้สูงกว่านิดหน่อย ไฟล์ที่เกินจะได้ไปตกที่ notes-service ซึ่งตอบ 413 เป็น JSON
    # แทนที่จะโดน nginx ตัดด้วยหน้า HTML ที่หน้าเว็บอ่านไม่ออก
    client_max_body_size 5m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # คำตอบของ gateway เป็น JSON แบบเดียวกับที่ service ตอบ หน้าเว็บจึงขึ้นข้อความเดิม
    # error_page ใช้กับ 401/500 ที่ nginx สร้างเองจาก auth_request เท่านั้น — 401/500 ที่ service ตอบมา
    # ผ่านไปตรง ๆ เพราะไม่ได้เปิด proxy_intercept_errors
    error_page 401 = @gateway_unauthorized;
    error_page 500 = @gateway_auth_unavailable;

    # header WWW-Authenticate: Bearer มาจากคำตอบ 401 ของ auth-service (auth_request ส่งต่อให้เอง)
    location @gateway_unauthorized {
        default_type application/json;
        return 401 '{"error": "unauthorized"}';
    }
    # auth-service ล่มหรือตอบอย่างอื่นที่ไม่ใช่ 2xx/401 — auth_request แปลงเป็น 500 ให้
    location @gateway_auth_unavailable {
        default_type application/json;
        return 503 '{"error": "auth_unavailable"}';
    }

    # subrequest ของ auth_request: route ที่ไม่ต้องตรวจตอบ 204 ทันที ไม่ถาม auth-service
    # ต้องคำนวณ $gateway_check ไว้ใน request หลักด้วย `set` ของแต่ละ location ก่อน เพราะใน subrequest
    # $uri คือ /_gateway/auth เอง ถ้าไม่มี `set` แล้วให้ map ทำงานตรงนี้ ทุก route จะกลายเป็น open
    # (ลองแล้ว 2026-10-09: GET /notes/1/stats ไม่มี token หลุดไปถึง stats-service)
    location = /_gateway/auth {
        internal;
        if ($gateway_check_main = skip) {
            return 204;
        }
        proxy_pass http://auth-service:5002/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # proxy_pass ไม่มี path ต่อท้าย = ส่ง URI เดิมทั้งก้อน (รวม query string) ไปให้ service
    location = /notes {
        set $gateway_check_main $gateway_check;
        auth_request /_gateway/auth;
        proxy_pass http://notes-service:5001;
    }
    location /notes/ {
        set $gateway_check_main $gateway_check;
        auth_request /_gateway/auth;
        proxy_pass http://notes-service:5001;
    }
    location /auth/ {
        proxy_pass http://auth-service:5002;
    }
    # รายการรายงานของผู้ดูแล (Issues #17, #18) อยู่ใน notes-service แต่ path ไม่ได้ขึ้นต้นด้วย /notes
    location = /reports {
        set $gateway_check_main $gateway_check;
        auth_request /_gateway/auth;
        proxy_pass http://notes-service:5001;
    }
    location /reports/ {
        set $gateway_check_main $gateway_check;
        auth_request /_gateway/auth;
        proxy_pass http://notes-service:5001;
    }
    # สถิติอยู่ใน stats-service (Issue #16, US-28 AC3) · location แบบ regex ถูกเลือกก่อน prefix `/notes/`
    # ข้างบนเสมอ จึงเฉพาะ /notes/<id>/stats เท่านั้นที่ไปถึง stats-service ส่วน /notes/<id> อื่น ๆ ยังไป notes-service
    location ~ ^/notes/[0-9]+/stats$ {
        set $gateway_check_main $gateway_check;
        auth_request /_gateway/auth;
        proxy_pass http://stats-service:5000;
    }
    location = /stats {
        proxy_pass http://stats-service:5000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
