<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteShare - ค้นหาโน้ต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Serif+Thai:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="session-utils.js" defer></script>
<script src="search-utils.js" defer></script>
<script src="site.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<nav id="siteNav" class="site-nav" aria-label="เมนูหลัก"></nav>

<main class="page-card">
  <header class="hero">
    <h1 class="page-title">โน้ตดี ๆ ที่ควร<mark>ส่งต่อ</mark></h1>
    <p>หาสรุปเลกเชอร์และโน้ตที่เพื่อนแบ่งปันไว้ หรืออัปโหลดของคุณเองให้คนถัดไปที่กำลังอ่านสอบ</p>
  </header>

  <form id="searchForm" class="search-form" role="search">
    <div class="search-bar">
      <svg class="search-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <label for="q" class="visually-hidden">คำค้นหา</label>
      <input type="search" id="q" name="q" class="search-input" maxlength="200"
             placeholder="ชื่อโน้ต วิชา รหัสวิชา บทเรียน หรือหัวข้อ">
      <button type="submit" class="primary-btn">ค้นหา</button>
    </div>

    <details class="filter-panel">
      <summary>ตัวกรองและการเรียง</summary>
      <div class="filter-body">
    <div class="filter-row">
      <label class="filter-field">
        <span>คณะ</span>
        <input type="text" name="faculty" class="filter-input" placeholder="เช่น ICT">
      </label>

      <label class="filter-field">
        <span>ชั้นปี</span>
        <select name="year_level" class="filter-input">
          <option value="">ทุกชั้นปี</option>
          <option value="1">ปี 1</option>
          <option value="2">ปี 2</option>
          <option value="3">ปี 3</option>
          <option value="4">ปี 4</option>
          <option value="5">ปี 5</option>
          <option value="6">ปี 6</option>
          <option value="7">ปี 7</option>
          <option value="8">ปี 8</option>
        </select>
      </label>

      <label class="filter-field">
        <span>หัวข้อ</span>
        <input type="text" name="topic" class="filter-input" placeholder="เช่น Merge Sort">
      </label>

      <label class="filter-field">
        <span>เรียนตั้งแต่</span>
        <input type="date" name="date_from" class="filter-input">
      </label>

      <label class="filter-field">
        <span>ถึง</span>
        <input type="date" name="date_to" class="filter-input">
      </label>

      <label class="filter-field">
        <span>เรียงตาม</span>
        <select name="sort" class="filter-input">
          <option value="new">อัปโหลดล่าสุด</option>
          <option value="old">อัปโหลดเก่าสุด</option>
          <option value="class_date">วันที่เรียนล่าสุด</option>
          <option value="title">ชื่อโน้ต ก-ฮ / A-Z</option>
        </select>
      </label>
    </div>

    <fieldset class="type-row">
      <legend>ประเภทไฟล์</legend>
      <label><input type="checkbox" name="file_type" value="pdf"> PDF</label>
      <label><input type="checkbox" name="file_type" value="png"> PNG</label>
      <label><input type="checkbox" name="file_type" value="jpg"> JPG</label>
    </fieldset>

    <div class="form-actions">
      <button type="submit" class="primary-btn">ใช้ตัวกรอง</button>
      <button type="button" id="resetBtn" class="secondary-btn">ล้างตัวกรอง</button>
    </div>
      </div>
    </details>
  </form>

  <div class="results-header">
    <span id="resultsCount" class="results-count" aria-live="polite"></span>
  </div>

  <p id="searchError" class="error-box" role="alert" hidden></p>
  <div id="resultsList" class="results-list"></div>
  <p id="noResults" class="no-results" hidden>ไม่พบโน้ตที่ตรงกับเงื่อนไข</p>
  <button type="button" id="loadMoreBtn" class="secondary-btn load-more" hidden>โหลดเพิ่ม</button>
</main>

<!-- US-11 AC3: the preview opens over the results, so closing it leaves the list and the
     scroll position exactly as they were -->
<dialog id="previewDialog" class="preview-dialog" aria-labelledby="previewTitle">
  <div class="preview-body">
    <header class="preview-header">
      <div>
        <h2 id="previewTitle" class="preview-title"></h2>
        <p id="previewUploader" class="note-uploader"></p>
      </div>
      <button type="button" id="previewClose" class="close-btn" aria-label="ปิดตัวอย่าง">✕</button>
    </header>
    <div class="preview-frame">
      <p id="previewStatus" class="preview-status" role="status"></p>
      <img id="previewImage" alt="" hidden>
    </div>
    <section class="rating-panel" aria-labelledby="ratingHeading">
      <h3 id="ratingHeading">คะแนนโน้ต</h3>
      <p id="previewRatingAverage" class="rating-average" aria-live="polite">กำลังโหลดคะแนน…</p>
      <p id="previewRatingMessage" class="rating-message" role="status"></p>
      <div id="previewRatingStars" class="rating-stars" role="group" aria-label="เลือกคะแนน 1 ถึง 5" hidden>
        <button type="button" class="rating-star" data-rating="1" aria-label="1 ดาว" aria-pressed="false">☆</button>
        <button type="button" class="rating-star" data-rating="2" aria-label="2 ดาว" aria-pressed="false">☆</button>
        <button type="button" class="rating-star" data-rating="3" aria-label="3 ดาว" aria-pressed="false">☆</button>
        <button type="button" class="rating-star" data-rating="4" aria-label="4 ดาว" aria-pressed="false">☆</button>
        <button type="button" class="rating-star" data-rating="5" aria-label="5 ดาว" aria-pressed="false">☆</button>
      </div>
      <button type="button" id="submitRating" class="secondary-btn" hidden disabled>ส่งคะแนน</button>
      <p id="ratingSubmitStatus" class="rating-message" role="status" aria-live="polite"></p>
    </section>
    <footer class="preview-footer">
      <span id="previewSize" class="note-sub"></span>
      <a id="previewDownload" class="primary-btn" href="#">⬇ ดาวน์โหลดไฟล์เต็ม</a>
    </footer>
  </div>
</dialog>

</body>
</html>
