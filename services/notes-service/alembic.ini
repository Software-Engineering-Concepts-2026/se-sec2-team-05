# Alembic CLI config for Notes Service (ADR-010). The service itself does not read this
# file: it migrates on startup through migrate.upgrade_to_head(). Use the CLI from this
# folder to write a new revision after changing models.py, for example:
#   DATABASE_URL=sqlite:///scratch.db alembic upgrade head
#   DATABASE_URL=sqlite:///scratch.db alembic revision --autogenerate -m "add notes.language"
# env.py reads DATABASE_URL, so there is no sqlalchemy.url here.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
