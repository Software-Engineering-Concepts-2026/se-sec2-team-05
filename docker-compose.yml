# สภาพแวดล้อม dev ของ NoteShare — ยกทุก service ขึ้นพร้อมกันด้วย `docker compose up`
# ตอนนี้มี 3 service ตาม C4 Container diagram: Notes Service (US-08), User & Auth Service
# (US-05/US-06) และ Stats Service — ยังไม่มี API Gateway (ดู ADR-003, ADR-005)
# ด้านหน้ามี `web` (nginx) เสิร์ฟหน้าเว็บและส่งต่อ /notes, /auth จาก origin เดียว แต่ยังไม่ตรวจ JWT
# จึงยังไม่ใช่ API Gateway เต็มตัว (ดู ADR-006)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noteshare
      POSTGRES_PASSWORD: noteshare_dev   # dev เท่านั้น — production ต้องมาจาก secret
      POSTGRES_DB: noteshare
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # กัน notes-service สตาร์ตก่อน Postgres พร้อมรับ connection
      test: ["CMD-SHELL", "pg_isready -U noteshare -d noteshare"]
      interval: 5s
      timeout: 3s
      retries: 10

  notes-service:
    build: ./services/notes-service
    environment:
      DATABASE_URL: postgresql+psycopg://noteshare:noteshare_dev@db:5432/noteshare
      NOTES_STORAGE_DIR: /data/notes
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      # การอัปโหลดต้อง login — notes-service ตรวจ token ผ่าน GET /auth/me (US-31, ADR-005)
      AUTH_SERVICE_URL: http://auth-service:5002
    ports:
      - "5001:5001"
    volumes:
      - notes-files:/data/notes
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql+psycopg://noteshare:noteshare_dev@db:5432/noteshare
      # dev เท่านั้น — production ต้องมาจาก secret ของ host ห้าม commit ค่าจริง
      AUTH_JWT_SECRET: noteshare_dev_only_jwt_secret_change_me_0123456789
      ALLOWED_EMAIL_DOMAINS: up.ac.th
      AUTH_TOKEN_TTL_HOURS: "8"
    ports:
      - "5002:5002"
    depends_on:
      db:
        condition: service_healthy

  stats-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://noteshare:noteshare_dev@db:5432/noteshare
      AUTH_SERVICE_URL: http://auth-service:5002
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started

  # หน้าเว็บ + gateway (ADR-006): เปิด http://localhost:8080 แล้ว browser จะเรียก /notes, /auth และ /stats
  # ผ่าน origin เดียวกันนี้ · port 5001/5002 ของ service ยังเปิดไว้ให้ curl และ smoke test เดิมใช้ต่อ
  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      notes-service:
        condition: service_started
      auth-service:
        condition: service_started
      # nginx resolve ชื่อ upstream ตอนสตาร์ต (ADR-006) ต้องมี stats-service ก่อน เพราะหน้าสถิติเรียกผ่าน gateway
      stats-service:
        condition: service_started

volumes:
  db-data:
  notes-files:
