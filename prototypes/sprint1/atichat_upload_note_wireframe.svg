<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" font-family="sans-serif">
  <!-- wireframe: upload note (story #7) -->
  <rect x="0" y="0" width="1100" height="740" fill="#f4f4f4"/>
  <text x="40" y="36" font-size="18" fill="#333">Wireframe — อัปโหลดโน้ต (Story #7)</text>
  <text x="40" y="54" font-size="12" fill="#888">low-fidelity · เน้นโครงสร้างและ flow</text>

  <!-- ===================== LEFT: main screen mockup ===================== -->
  <rect x="50" y="70" width="420" height="640" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- header bar -->
  <rect x="50" y="70" width="420" height="46" rx="8" fill="#eaeaea" stroke="#333" stroke-width="2"/>
  <text x="70" y="99" font-size="15" fill="#333">📓 NoteShare</text>
  <circle cx="440" cy="93" r="12" fill="#d3d3d3" stroke="#333"/>

  <!-- title -->
  <text x="72" y="152" font-size="20" fill="#222">แบ่งปันโน้ต</text>
  <text x="72" y="173" font-size="12" fill="#777">อัปโหลดไฟล์สรุป (PDF / รูปภาพ) เพื่อแบ่งปันให้เพื่อน</text>

  <!-- note title -->
  <text x="72" y="206" font-size="13" fill="#444">ชื่อโน้ต</text>
  <rect x="72" y="216" width="376" height="34" rx="3" fill="#fff" stroke="#999"/>

  <!-- subject -->
  <text x="72" y="282" font-size="13" fill="#444">ชื่อวิชา / รหัสวิชา</text>
  <rect x="72" y="292" width="376" height="34" rx="3" fill="#fff" stroke="#999"/>

  <!-- file input -->
  <text x="72" y="358" font-size="13" fill="#444">เลือกไฟล์ (PDF / รูปภาพ)</text>
  <rect x="72" y="368" width="376" height="34" rx="3" fill="#f4f4f4" stroke="#999"/>
  <rect x="80" y="374" width="86" height="22" rx="3" fill="#ddd" stroke="#999"/>
  <text x="123" y="389" font-size="11" text-anchor="middle" fill="#555">Choose File</text>
  <text x="178" y="389" font-size="11" fill="#999">ยังไม่ได้เลือกไฟล์</text>

  <!-- description -->
  <text x="72" y="434" font-size="13" fill="#444">คำอธิบาย (ไม่บังคับ)</text>
  <rect x="72" y="444" width="376" height="60" rx="3" fill="#fff" stroke="#999"/>

  <!-- submit button -->
  <rect x="72" y="524" width="376" height="40" rx="3" fill="#cfe0ff" stroke="#3b7ddd" stroke-width="1.5"/>
  <text x="260" y="549" font-size="14" text-anchor="middle" fill="#25508f">อัปโหลด</text>

  <text x="72" y="596" font-size="11" fill="#999">* กดปุ่ม → เช็คว่ากรอกครบ + ไฟล์ถูกชนิด (≤10MB) → แสดง alert</text>

  <!-- element markers (badges on right edge of card) -->
  <g font-size="11" text-anchor="middle" fill="#333">
    <circle cx="492" cy="93" r="11" fill="#fff" stroke="#333"/><text x="492" y="97">①</text>
    <circle cx="492" cy="233" r="11" fill="#fff" stroke="#333"/><text x="492" y="237">②</text>
    <circle cx="492" cy="309" r="11" fill="#fff" stroke="#333"/><text x="492" y="313">③</text>
    <circle cx="492" cy="385" r="11" fill="#fff" stroke="#333"/><text x="492" y="389">④</text>
    <circle cx="492" cy="474" r="11" fill="#fff" stroke="#333"/><text x="492" y="478">⑤</text>
    <circle cx="492" cy="544" r="11" fill="#fff" stroke="#333"/><text x="492" y="548">⑥</text>
  </g>
  <g stroke="#bbb" stroke-dasharray="3 3">
    <line x1="470" y1="93" x2="481" y2="93"/>
    <line x1="448" y1="233" x2="481" y2="233"/>
    <line x1="448" y1="309" x2="481" y2="309"/>
    <line x1="448" y1="385" x2="481" y2="385"/>
    <line x1="448" y1="474" x2="481" y2="474"/>
    <line x1="448" y1="544" x2="481" y2="544"/>
  </g>

  <!-- ===================== RIGHT: notes, flow, persona ===================== -->
  <!-- element notes -->
  <text x="540" y="92" font-size="15" fill="#333">องค์ประกอบ (Elements)</text>
  <g font-size="12" fill="#444">
    <text x="540" y="120">① Header — โลโก้ NoteShare + avatar (บอกว่าล็อกอินแล้ว)</text>
    <text x="540" y="146">② ชื่อโน้ต — ช่องข้อความ (จำเป็น)</text>
    <text x="540" y="172">③ ชื่อวิชา / รหัสวิชา — ช่องข้อความ (จำเป็น) ใช้ค้นหา/จัดหมวด</text>
    <text x="540" y="198">④ เลือกไฟล์ — รับ .pdf .png .jpg ขนาด ≤10MB (จำเป็น)</text>
    <text x="540" y="224">⑤ คำอธิบาย — textarea (ไม่บังคับ)</text>
    <text x="540" y="250">⑥ ปุ่มอัปโหลด — onclick → validate → alert</text>
  </g>

  <!-- flow / storyboard -->
  <text x="540" y="298" font-size="15" fill="#333">ลำดับการทำงาน (Flow)</text>

  <rect x="540" y="312" width="158" height="110" rx="5" fill="#fff" stroke="#333"/>
  <text x="550" y="332" font-size="11" fill="#555">1. กรอกฟอร์ม + เลือกไฟล์</text>
  <rect x="552" y="342" width="134" height="14" rx="2" fill="#f0f0f0" stroke="#bbb"/>
  <rect x="552" y="362" width="134" height="14" rx="2" fill="#f0f0f0" stroke="#bbb"/>
  <rect x="552" y="386" width="80" height="18" rx="2" fill="#ddd" stroke="#999"/>
  <text x="592" y="399" font-size="9" text-anchor="middle" fill="#555">Choose File</text>

  <rect x="716" y="312" width="158" height="110" rx="5" fill="#fff" stroke="#333"/>
  <text x="726" y="332" font-size="11" fill="#555">2. กด "อัปโหลด"</text>
  <text x="726" y="349" font-size="10" fill="#999">ถ้าไม่ครบ / ผิดชนิด</text>
  <rect x="726" y="360" width="138" height="46" rx="3" fill="#fdecec" stroke="#e0a3a3"/>
  <text x="795" y="380" font-size="10" text-anchor="middle" fill="#b23">⚠ กรุณากรอกข้อมูล</text>
  <text x="795" y="395" font-size="10" text-anchor="middle" fill="#b23">ให้ครบ / ไฟล์ผิดชนิด</text>

  <rect x="892" y="312" width="158" height="110" rx="5" fill="#fff" stroke="#333"/>
  <text x="902" y="332" font-size="11" fill="#555">3. ครบ + ไฟล์ถูกต้อง</text>
  <rect x="902" y="348" width="138" height="46" rx="3" fill="#e8f6ec" stroke="#a3d3b0"/>
  <text x="971" y="368" font-size="10" text-anchor="middle" fill="#1f7a3d">✓ อัปโหลดสำเร็จ!</text>
  <text x="971" y="383" font-size="10" text-anchor="middle" fill="#1f7a3d">(ตัวอย่าง prototype)</text>

  <text x="704" y="372" font-size="16" fill="#888">→</text>
  <text x="880" y="372" font-size="16" fill="#888">→</text>

  <!-- persona linkage (full text) -->
  <text x="540" y="470" font-size="15" fill="#333">เชื่อมโยง Persona (Story #7)</text>
  <rect x="540" y="482" width="520" height="212" rx="6" fill="#fffceb" stroke="#d9c65f" stroke-width="1.5"/>
  <g font-size="12" fill="#6f6320">
    <text x="556" y="508" font-weight="bold">Persona: พิม (พิมพ์ชนก) — ผู้แบ่งปันโน้ต</text>
    <text x="556" y="534" font-weight="bold">Pain Point:</text>
    <text x="556" y="552">อัปโหลดโน้ตผ่านแชทกลุ่มทำให้ไฟล์เก่าจมหาย ต้องส่งไฟล์เดิมซ้ำๆ ให้เพื่อน</text>
    <text x="556" y="570">ที่มาขอทีหลัง และไม่มีระบบกลางให้เพื่อนไปหาเอง</text>
    <text x="556" y="596" font-weight="bold">หน้าจอนี้ช่วยแก้ได้ยังไง:</text>
    <text x="556" y="614">หน้า "แบ่งปันโน้ต" ให้พิมกรอกชื่อโน้ต+ชื่อวิชา เลือกไฟล์ PDF/รูปภาพ กดอัปโหลด</text>
    <text x="556" y="632">จบในที่เดียว โน้ตถูกเก็บเป็นระบบในที่กลาง เพื่อนเข้ามาค้นหาเองได้ พิมไม่ต้อง</text>
    <text x="556" y="650">ส่งไฟล์ซ้ำให้คนที่มาขอทีหลัง และผลงานของเธอไม่จมหายไปในแชทกลุ่ม</text>
    <text x="556" y="676" fill="#8a7a2a">→ ออกแบบโดยยึดผู้ใช้เป็นศูนย์กลาง ไม่ใช่แค่ความสะดวกของนักพัฒนา</text>
  </g>
</svg>
