# CI สำหรับ NoteShare — รันทุก push และทุก PR ที่ยิงเข้า main
# ทั้งสาม job แยกกันเพื่อให้เห็นชัดว่าอะไรพัง: เทสต์ JS, เทสต์ Python, หรือ image build
name: CI

on:
  push:
    branches: [main]
  # ไม่กรอง branch ปลายทาง เพราะ PR ที่ซ้อนกัน (base เป็น feature branch อื่น)
  # จะไม่ถูกทดสอบเลยถ้าจำกัดไว้แค่ `branches: [main]`
  pull_request:

jobs:
  # ตรวจโค้ด Python ด้วย ruff ตามกฎใน ruff.toml (Lab 12B) — ไม่ต้องติดตั้ง dependency ของ service
  # ล็อกเวอร์ชันไว้ ไม่ให้ CI แดงเองวันที่ ruff ออกเวอร์ชันใหม่ที่เพิ่มกฎ
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff
        run: ruff check .

  js-tests:
    name: Unit tests (JS prototypes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ใช้ test runner ที่มากับ Node เอง ไม่ต้องมี package.json / npm install
      # ต้อง cd เข้าโฟลเดอร์แล้วรัน `node --test` เปล่า ๆ — ถ้าส่ง path โฟลเดอร์เป็น
      # argument ตรง ๆ Node 24 จะตีความว่าเป็นชื่อ module แล้ว MODULE_NOT_FOUND
      - name: Run note-utils tests
        working-directory: prototypes/sprint1
        run: node --test

      - name: Run web unit tests
        working-directory: web
        run: node --test

  python-tests:
    name: Unit tests (Stats Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r services/stats-service/requirements.txt
          pip install -r services/notes-service/requirements.txt
          pip install -r services/auth-service/requirements.txt
          pip install -r src/tests/requirements-dev.txt

      - name: Run pytest
        run: pytest src/tests -v --cov=services/notes-service --cov=services/auth-service --cov=src --cov-report=term-missing

  docker-build:
    name: Build & smoke-test stack
    runs-on: ubuntu-latest
    # ไม่ต้องเสียเวลา build image ถ้าเทสต์ยังไม่ผ่าน
    needs: [js-tests, python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the whole stack
        run: docker compose up -d --build

      # gunicorn/postgres ใช้เวลา boot ไม่กี่วินาที — retry แทนการ sleep ตายตัว
      - name: Wait for services to become healthy
        run: |
          for url in http://localhost:5000/health http://localhost:5001/health http://localhost:5002/health http://localhost:8080/; do
            ok=false
            for i in $(seq 1 20); do
              if curl -fsS "$url" > /dev/null; then ok=true; break; fi
              sleep 3
            done
            if [ "$ok" != true ]; then
              echo "::error::$url did not become healthy"
              docker compose logs
              exit 1
            fi
            echo "$url OK"
          done

      # US-31: การอัปโหลดต้อง login — เตรียมบัญชีผู้อัปโหลดไว้ให้ smoke test ของ notes ทุกขั้นใช้ร่วมกัน
      - name: Log in an uploader account for the notes smoke tests
        run: |
          set -euo pipefail
          auth=http://localhost:5002/auth
          uploader='{"email":"ci.uploader@up.ac.th","password":"ci uploader password","display_name":"CI Uploader"}'
          curl -fsS -o /dev/null -X POST "$auth/register" -H 'Content-Type: application/json' -d "$uploader"
          upload_token=$(curl -fsS -X POST "$auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci.uploader@up.ac.th","password":"ci uploader password"}' | jq -r '.access_token')
          test "$upload_token" != "null"
          echo "::add-mask::$upload_token"
          echo "UPLOAD_TOKEN=$upload_token" >> "$GITHUB_ENV"

      # US-31 บน stack จริง: ไม่ login ต้องอัปโหลดไม่ได้ และชื่อผู้อัปโหลดต้องมาจากบัญชี ไม่ใช่จากฟอร์ม
      - name: Upload requires login and credits the account
        run: |
          set -euo pipefail
          printf '%s' '%PDF-1.4 ci auth note' > /tmp/auth.pdf
          form=(-F 'title=CI auth note' -F 'subject_name=Networks' -F 'subject_code=CS401' -F 'faculty=ICT'
                -F 'year_level=4' -F 'lesson=TCP' -F 'uploader_name=spoofed name' -F 'file=@/tmp/auth.pdf;type=application/pdf')

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5001/notes "${form[@]}")
          test "$status" = "401"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5001/notes \
            -H 'Authorization: Bearer not-a-real-token' "${form[@]}")
          test "$status" = "401"

          created=$(curl -fsS -X POST http://localhost:5001/notes -H "Authorization: Bearer $UPLOAD_TOKEN" "${form[@]}")
          test "$(echo "$created" | jq -r '.uploader_name')" = "CI Uploader"
          # ครั้งที่ไม่ได้ login ต้องไม่มีโน้ตถูกสร้าง มีแค่ใบที่ login แล้วใบเดียว
          test "$(curl -fsS 'http://localhost:5001/notes?subject_code=CS401' | jq '.count')" -eq 1
          echo "upload auth OK"

      # เส้นทาง end-to-end ของ US-08: อัปโหลดพร้อม metadata -> กรองเจอ -> ดาวน์โหลดไฟล์เดิมกลับมา
      - name: End-to-end smoke test (upload -> filter -> download)
        run: |
          set -euo pipefail
          # ใช้ printf '%s' เพราะ '%PDF' ถูกตีความเป็น format specifier ที่ไม่มีอยู่จริง
          printf '%s' '%PDF-1.4 ci smoke note' > /tmp/note.pdf
          note_id=$(curl -fsS -X POST http://localhost:5001/notes -H "Authorization: Bearer $UPLOAD_TOKEN"             -F 'title=CI smoke note'             -F 'subject_name=Data Structures'             -F 'subject_code=CS201'             -F 'faculty=ICT'             -F 'year_level=2'             -F 'lesson=Linked List'             -F 'class_date=2026-08-20'             -F 'file=@/tmp/note.pdf;type=application/pdf' | jq -r '.id')
          echo "created note #$note_id"

          count=$(curl -fsS 'http://localhost:5001/notes?faculty=ICT&year_level=2&q=CS201' | jq '.count')
          test "$count" -eq 1

          curl -fsS "http://localhost:5001/notes/$note_id/download" -o /tmp/downloaded.pdf
          cmp /tmp/note.pdf /tmp/downloaded.pdf
          echo "end-to-end OK"

      # เส้นทางของ US-19/US-20: แก้ metadata ด้วย edit token แล้วลบทิ้ง พร้อมเช็คว่าคนที่ไม่มี token ทำไม่ได้
      - name: End-to-end smoke test (edit -> delete with edit token)
        run: |
          set -euo pipefail
          printf '%s' '%PDF-1.4 ci edit note' > /tmp/edit.pdf
          created=$(curl -fsS -X POST http://localhost:5001/notes -H "Authorization: Bearer $UPLOAD_TOKEN"             -F 'title=CI edit note'             -F 'subject_name=Algorithms'             -F 'subject_code=CS301'             -F 'faculty=ICT'             -F 'year_level=3'             -F 'lesson=Sorting'             -F 'file=@/tmp/edit.pdf;type=application/pdf')
          note_id=$(echo "$created" | jq -r '.id')
          token=$(echo "$created" | jq -r '.edit_token')
          test "$token" != "null"

          # ไม่มี token ต้องแก้ไม่ได้และลบไม่ได้
          for verb in PATCH DELETE; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X $verb "http://localhost:5001/notes/$note_id" -d 'title=hijacked')
            test "$status" = "403"
          done

          # มี token ถึงจะแก้ได้ และ updated_at ต้องถูกประทับ
          updated=$(curl -fsS -X PATCH "http://localhost:5001/notes/$note_id"             -H "X-Note-Token: $token" -d 'topic=Merge Sort')
          test "$(echo "$updated" | jq -r '.topic')" = "Merge Sort"
          test "$(echo "$updated" | jq -r '.updated_at')" != "null"
          # ฟิลด์ที่ไม่ได้ส่งมาต้องคงเดิม
          test "$(echo "$updated" | jq -r '.subject_code')" = "CS301"

          status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://localhost:5001/notes/$note_id" -H "X-Note-Token: $token")
          test "$status" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5001/notes/$note_id")" = "404"
          echo "edit/delete OK"

      # Issue #82 + #83 บน Postgres จริง: เจ้าของแก้/ลบด้วยการ login (ADR-008), /notes/mine
      # และ sort=rating ที่ต้องเอาโน้ตไม่มีคะแนนไว้ท้าย — Postgres เรียง NULL ไว้หน้าสุดเมื่อ DESC
      # ต่างจาก SQLite ในเทสต์ จึงต้องเช็คบน stack จริง
      - name: 'Owner login and sort by rating on the real stack (Issues #82, #83)'
        run: |
          set -euo pipefail
          auth=http://localhost:5002/auth
          notes=http://localhost:5001/notes
          rater='{"email":"ci.rater@up.ac.th","password":"ci rater password","display_name":"CI Rater"}'
          curl -fsS -o /dev/null -X POST "$auth/register" -H 'Content-Type: application/json' -d "$rater"
          rater_token=$(curl -fsS -X POST "$auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci.rater@up.ac.th","password":"ci rater password"}' | jq -r '.access_token')
          test "$rater_token" != "null"
          echo "::add-mask::$rater_token"

          printf '%s' '%PDF-1.4 ci owner note' > /tmp/owner.pdf
          upload() {
            curl -fsS -X POST "$notes" -H "Authorization: Bearer $UPLOAD_TOKEN" -F "title=$1" \
              -F 'subject_name=Compilers' -F 'subject_code=CS501' -F 'faculty=ICT' -F 'year_level=4' \
              -F 'lesson=Parsing' -F 'file=@/tmp/owner.pdf;type=application/pdf' | jq -r '.id'
          }
          rated=$(upload 'CI rated note')
          unrated=$(upload 'CI unrated note')

          # ต้องเปิดดูก่อนถึงให้คะแนนได้ (Issue #13)
          curl -fsS -o /dev/null "$notes/$rated" -H "Authorization: Bearer $rater_token"
          curl -fsS -o /dev/null -X PUT "$notes/$rated/rating" -H "Authorization: Bearer $rater_token" \
            -H 'Content-Type: application/json' -d '{"rating": 4}'
          # โน้ตที่ไม่มีคะแนนใหม่กว่า แต่ต้องอยู่ท้าย
          test "$(curl -fsS "$notes?subject_code=CS501&sort=rating" | jq -r '.items | map(.id) | join(",")')" = "$rated,$unrated"

          mine=$(curl -fsS "$notes/mine" -H "Authorization: Bearer $UPLOAD_TOKEN")
          echo "$mine" | jq -e --argjson a "$rated" --argjson b "$unrated" '[.items[].id] | index($a) != null and index($b) != null' > /dev/null
          test "$(echo "$mine" | jq -r '.summary.rating_count')" = "1"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$notes/mine")" = "401"

          # คนอื่นที่ login อยู่แก้/ลบไม่ได้ เจ้าของทำได้โดยไม่ต้องมี edit token
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "$notes/$rated" -H "Authorization: Bearer $rater_token" -d 'title=hijacked')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$notes/$rated" -H "Authorization: Bearer $rater_token")" = "403"
          test "$(curl -fsS -X PATCH "$notes/$rated" -H "Authorization: Bearer $UPLOAD_TOKEN" -d 'topic=LL(1)' | jq -r '.topic')" = "LL(1)"
          for id in "$rated" "$unrated"; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$notes/$id" -H "Authorization: Bearer $UPLOAD_TOKEN")" = "204"
          done
          echo "owner login + sort=rating OK"

      # เส้นทางของ US-05/US-06 บน Postgres จริง: สมัคร -> login -> ใช้ token -> logout -> token ต้องใช้ไม่ได้ทันที
      - name: End-to-end smoke test (register -> login -> me -> logout)
        run: |
          set -euo pipefail
          auth=http://localhost:5002/auth
          member='{"email":"ci.smoke@up.ac.th","password":"ci smoke password","display_name":"CI Smoke"}'

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$auth/register" -H 'Content-Type: application/json' -d "$member")
          test "$status" = "201"
          # อีเมลซ้ำต้องไม่ได้บัญชีที่สอง
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$auth/register" -H 'Content-Type: application/json' -d "$member")
          test "$status" = "409"
          # อีเมลนอกโดเมนมหาวิทยาลัยต้องสมัครไม่ได้
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$auth/register" -H 'Content-Type: application/json'             -d '{"email":"someone@gmail.com","password":"ci smoke password","display_name":"x"}')
          test "$status" = "400"

          # รหัสผิดกับอีเมลที่ไม่มีต้องได้คำตอบเดียวกัน (กัน enumeration)
          wrong=$(curl -s -X POST "$auth/login" -H 'Content-Type: application/json' -d '{"email":"ci.smoke@up.ac.th","password":"nope nope"}')
          unknown=$(curl -s -X POST "$auth/login" -H 'Content-Type: application/json' -d '{"email":"nobody@up.ac.th","password":"nope nope"}')
          test "$wrong" = "$unknown"
          test "$(echo "$wrong" | jq -r '.error')" = "invalid_credentials"

          token=$(curl -fsS -X POST "$auth/login" -H 'Content-Type: application/json'             -d '{"email":"ci.smoke@up.ac.th","password":"ci smoke password"}' | jq -r '.access_token')
          test "$token" != "null"
          test "$(curl -fsS "$auth/me" -H "Authorization: Bearer $token" | jq -r '.display_name')" = "CI Smoke"

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$auth/logout" -H "Authorization: Bearer $token")
          test "$status" = "204"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$auth/me" -H "Authorization: Bearer $token")
          test "$status" = "401"
          echo "auth OK"

      - name: Metadata validation is enforced
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5001/notes \
            -H "Authorization: Bearer $UPLOAD_TOKEN" -F 'title=missing everything else')
          test "$status" = "400"

      # US-11 บน stack จริง: การ render preview ต้องทำงานผ่าน image จริง (ไม่ใช่แค่ import จาก
      # source tree เหมือน unit test) เพราะเคยเจอบั๊กที่ Dockerfile ลืม copy preview.py เข้า image
      # มาแล้วครั้งหนึ่ง (commit 8f25b9b) ซึ่ง unit test ตอนนั้นเขียวอยู่แต่ container พังจริง
      - name: Preview endpoint renders on the real stack (US-11)
        run: |
          set -euo pipefail
          # PNG 1x1 พิกเซลจริง (ไม่ใช่แค่ header ปลอม) เข้ารหัส base64 ไว้
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | base64 -d > /tmp/preview.png

          created=$(curl -fsS -X POST http://localhost:5001/notes -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F 'title=CI preview note' -F 'subject_name=Graphics' -F 'subject_code=CS501' -F 'faculty=ICT' \
            -F 'year_level=4' -F 'lesson=Rendering' -F 'file=@/tmp/preview.png;type=image/png')
          preview_url=$(echo "$created" | jq -r '.preview_url')

          # เรียกโดยไม่ส่ง Authorization เลย — endpoint นี้ต้องอ่านได้โดยไม่ login เหมือน /download
          status=$(curl -s -D /tmp/preview-headers.txt -o /tmp/preview-out.png -w '%{http_code}' \
            "http://localhost:5001$preview_url")
          test "$status" = "200"
          grep -qi '^content-type: image/png' /tmp/preview-headers.txt
          python3 -c "assert open('/tmp/preview-out.png','rb').read(8) == b'\x89PNG\r\n\x1a\n'"

          # ไฟล์ที่ประกาศเป็น image/png แต่เนื้อไม่ใช่รูปจริงต้องได้ 422 ไม่ใช่ 500
          printf '%s' 'not a real png' > /tmp/fake.png
          fake=$(curl -fsS -X POST http://localhost:5001/notes -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F 'title=CI fake preview' -F 'subject_name=Graphics' -F 'subject_code=CS502' -F 'faculty=ICT' \
            -F 'year_level=4' -F 'lesson=Rendering' -F 'file=@/tmp/fake.png;type=image/png')
          fake_preview_url=$(echo "$fake" | jq -r '.preview_url')
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5001$fake_preview_url")
          test "$status" = "422"
          echo "preview OK"

      # ADR-006: หน้าเว็บกับ API ต้องมาจาก origin เดียวกันผ่าน gateway (port 8080) — เช็คทั้งไฟล์ static,
      # การส่งต่อ query string, header Authorization และ multipart upload ที่ต้องผ่าน nginx ไปถึง service
      - name: Web gateway serves the page and proxies the APIs (ADR-006)
        run: |
          set -euo pipefail
          gw=http://localhost:8080
          # เก็บลงไฟล์ก่อน grep — ถ้า pipe ตรง ๆ grep -q ปิด pipe เร็ว curl โดน SIGPIPE แล้ว pipefail ทำให้ step ล้มแบบสุ่ม
          curl -fsS "$gw/" -o /tmp/index.html
          grep -q 'id="searchForm"' /tmp/index.html
          curl -fsS "$gw/login.html" -o /tmp/login.html
          grep -q 'id="loginForm"' /tmp/login.html
          curl -fsS "$gw/upload.html" -o /tmp/upload.html
          grep -q 'id="uploadForm"' /tmp/upload.html
          for js in app.js site.js login.js upload.js search-utils.js session-utils.js upload-utils.js; do
            curl -fsS -o /dev/null "$gw/$js"
          done
          # ไฟล์เทสต์กับ config ต้องไม่ถูกเสิร์ฟออกไป
          for js in search-utils.test.js session-utils.test.js upload-utils.test.js; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "$gw/$js")" = "404"
          done
          # หน้าโปรไฟล์ (Issue #85)
          curl -fsS "$gw/profile.html" -o /tmp/profile.html
          grep -q 'id="profileStats"' /tmp/profile.html
          curl -fsS -o /dev/null "$gw/profile.js"
          curl -fsS -o /dev/null "$gw/profile-utils.js"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$gw/profile-utils.test.js")" = "404"

          # query string ต้องไปถึง notes-service ครบ (โน้ต CS201 สร้างไว้ใน step end-to-end ด้านบน)
          test "$(curl -fsS "$gw/notes?subject_code=CS201&year_level=2" | jq '.count')" -eq 1
          test "$(curl -s -o /dev/null -w '%{http_code}' "$gw/notes?year_level=abc")" = "400"

          # header Authorization ต้องผ่าน gateway ไปถึง auth-service
          test "$(curl -s -o /dev/null -w '%{http_code}' "$gw/auth/me")" = "401"
          test "$(curl -fsS "$gw/auth/me" -H "Authorization: Bearer $UPLOAD_TOKEN" | jq -r '.display_name')" = "CI Uploader"

          # upload แบบ multipart ผ่าน gateway แล้วเปิด preview ผ่าน gateway เหมือนที่หน้าเว็บทำ
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' \
            | base64 -d > /tmp/gateway.png
          created=$(curl -fsS -X POST "$gw/notes" -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F 'title=CI gateway note' -F 'subject_name=Web' -F 'subject_code=CS601' -F 'faculty=ICT' \
            -F 'year_level=4' -F 'lesson=Proxy' -F 'file=@/tmp/gateway.png;type=image/png')
          test "$(echo "$created" | jq -r '.uploader_name')" = "CI Uploader"
          preview_url=$(echo "$created" | jq -r '.preview_url')
          status=$(curl -s -D /tmp/gateway-headers.txt -o /dev/null -w '%{http_code}' "$gw$preview_url")
          test "$status" = "200"
          grep -qi '^content-type: image/png' /tmp/gateway-headers.txt

          # login ผ่าน gateway แบบที่ login.html ทำ (JSON) แล้ว logout ต้องทำให้ token นั้นใช้ไม่ได้ทันที
          web_token=$(curl -fsS -X POST "$gw/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci.uploader@up.ac.th","password":"ci uploader password"}' | jq -r '.access_token')
          test "$web_token" != "null"
          echo "::add-mask::$web_token"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$gw/auth/logout" -H "Authorization: Bearer $web_token")" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$gw/auth/me" -H "Authorization: Bearer $web_token")" = "401"
          echo "gateway OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
