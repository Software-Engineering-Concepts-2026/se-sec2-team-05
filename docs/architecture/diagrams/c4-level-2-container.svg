<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120" viewBox="0 0 1480 1120" font-family="'Segoe UI','Leelawadee UI',Arial,sans-serif">
  <style>
    .title    { font-size: 26px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 14px; fill: #6b6b6b; }
    .b-title  { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .b-tech   { font-size: 11.5px; fill: #dbe7f3; font-style: italic; }
    .b-desc   { font-size: 12px; fill: #eef4fb; }
    .edge     { font-size: 12px; font-weight: 500; fill: #20232a;
                paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .boundary-label { font-size: 14px; font-weight: 700; fill: #4a4a4a; }
    .legend   { font-size: 12.5px; fill: #333; }
  </style>

  <rect x="0" y="0" width="1480" height="1120" fill="#ffffff"/>

  <text class="title" x="40" y="52">NoteShare &#8212; C4 Model &#183; Level 2: Container Diagram</text>
  <text class="subtitle" x="40" y="76">The containers (deployable/runnable units) that make up the NoteShare platform and how they communicate</text>

  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#707070"/>
    </marker>
  </defs>

  <!-- system boundary -->
  <rect x="90" y="250" width="1180" height="760" rx="14" fill="#f2f6fb" stroke="#5a7fa6" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text class="boundary-label" x="112" y="278">NoteShare Platform  [Software System boundary]</text>

  <!-- ============ relationships (under boxes) ============ -->
  <!-- James -> SPA -->
  <line x1="305" y1="214" x2="600" y2="322" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="418" y="268" text-anchor="middle">Uses  [HTTPS]</text>
  <!-- Pim -> SPA -->
  <line x1="1115" y1="214" x2="820" y2="322" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="1002" y="268" text-anchor="middle">Uses  [HTTPS]</text>

  <!-- SPA -> Gateway -->
  <line x1="710" y1="420" x2="710" y2="468" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="722" y="449" text-anchor="start">API calls  [JSON/HTTPS]</text>

  <!-- Gateway -> Notes -->
  <line x1="640" y1="560" x2="360" y2="638" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="470" y="596" text-anchor="middle">routes  [JSON/HTTP]</text>
  <!-- Gateway -> Stats -->
  <line x1="710" y1="560" x2="710" y2="638" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="722" y="604" text-anchor="start">routes  [JSON/HTTP]</text>
  <!-- Gateway -> User&Auth -->
  <line x1="780" y1="560" x2="1060" y2="638" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="952" y="596" text-anchor="middle">routes  [JSON/HTTP]</text>

  <!-- Notes -> Stats (usage events) -->
  <line x1="450" y1="695" x2="583" y2="695" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="516" y="680" text-anchor="middle">
    <tspan x="516">reports usage</tspan>
    <tspan x="516" dy="14">events [JSON/HTTP]</tspan>
  </text>

  <!-- Notes -> Object Storage -->
  <line x1="330" y1="750" x2="365" y2="858" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="318" y="800" text-anchor="end">
    <tspan x="318">stores/reads</tspan>
    <tspan x="318" dy="14">files [S3 API]</tspan>
  </text>
  <!-- Notes -> Postgres -->
  <line x1="370" y1="750" x2="690" y2="858" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="520" y="796" text-anchor="middle">metadata, credits [SQL]</text>
  <!-- Stats -> Postgres -->
  <line x1="720" y1="750" x2="745" y2="858" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="760" y="806" text-anchor="start">stats [SQL]</text>
  <!-- User&Auth -> Postgres -->
  <line x1="1075" y1="750" x2="775" y2="858" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="930" y="800" text-anchor="middle">users [SQL]</text>

  <!-- User&Auth -> Email -->
  <line x1="1220" y1="690" x2="1298" y2="668" stroke="#707070" stroke-width="2" marker-end="url(#arrow2)"/>
  <text class="edge" x="1210" y="628" text-anchor="middle">sends email [SMTP]</text>

  <!-- ============ Persons ============ -->
  <g>
    <rect x="150" y="95" width="230" height="118" rx="10" fill="#08427b"/>
    <circle cx="265" cy="118" r="8" fill="#ffffff" opacity="0.9"/>
    <path d="M251 135 a14 10 0 0 1 28 0" fill="#ffffff" opacity="0.9"/>
    <text class="b-title" x="265" y="156" text-anchor="middle">James &#8212; Note Seeker</text>
    <text class="b-desc"  x="265" y="174" text-anchor="middle">[Person]</text>
    <text class="b-desc"  x="265" y="196" text-anchor="middle">Finds &amp; downloads notes</text>
  </g>
  <g>
    <rect x="1040" y="95" width="230" height="118" rx="10" fill="#08427b"/>
    <circle cx="1155" cy="118" r="8" fill="#ffffff" opacity="0.9"/>
    <path d="M1141 135 a14 10 0 0 1 28 0" fill="#ffffff" opacity="0.9"/>
    <text class="b-title" x="1155" y="156" text-anchor="middle">Pim &#8212; Note Contributor</text>
    <text class="b-desc"  x="1155" y="174" text-anchor="middle">[Person]</text>
    <text class="b-desc"  x="1155" y="196" text-anchor="middle">Uploads &amp; shares notes</text>
  </g>

  <!-- ============ Containers ============ -->
  <!-- SPA -->
  <g>
    <rect x="560" y="320" width="300" height="100" rx="10" fill="#438dd5"/>
    <text class="b-title" x="710" y="352" text-anchor="middle">Single-Page App</text>
    <text class="b-tech"  x="710" y="371" text-anchor="middle">[Container: React + Vite]</text>
    <text class="b-desc"  x="710" y="394" text-anchor="middle">
      <tspan x="710">Delivers the NoteShare UI: search,</tspan>
      <tspan x="710" dy="14">preview, upload, credit.</tspan>
    </text>
  </g>

  <!-- API Gateway -->
  <g>
    <rect x="560" y="470" width="300" height="90" rx="10" fill="#438dd5"/>
    <text class="b-title" x="710" y="500" text-anchor="middle">API Gateway</text>
    <text class="b-tech"  x="710" y="518" text-anchor="middle">[Container: Python + Flask]</text>
    <text class="b-desc"  x="710" y="540" text-anchor="middle">Single entry point; routes calls,</text>
    <text class="b-desc"  x="710" y="554" text-anchor="middle">verifies auth tokens (JWT).</text>
  </g>

  <!-- Notes Service -->
  <g>
    <rect x="200" y="638" width="250" height="112" rx="10" fill="#438dd5"/>
    <text class="b-title" x="325" y="668" text-anchor="middle">Notes Service</text>
    <text class="b-tech"  x="325" y="686" text-anchor="middle">[Container: Python + Flask]</text>
    <text class="b-desc"  x="325" y="708" text-anchor="middle">Note metadata, search/filter,</text>
    <text class="b-desc"  x="325" y="722" text-anchor="middle">upload/download, credits.</text>
  </g>

  <!-- Stats Service -->
  <g>
    <rect x="585" y="638" width="250" height="112" rx="10" fill="#438dd5"/>
    <text class="b-title" x="710" y="668" text-anchor="middle">Stats Service</text>
    <text class="b-tech"  x="710" y="686" text-anchor="middle">[Container: Python + Flask]</text>
    <text class="b-desc"  x="710" y="708" text-anchor="middle">Aggregates downloads &amp; note</text>
    <text class="b-desc"  x="710" y="722" text-anchor="middle">usage for contributor recognition.</text>
  </g>

  <!-- User & Auth Service -->
  <g>
    <rect x="970" y="638" width="250" height="112" rx="10" fill="#438dd5"/>
    <text class="b-title" x="1095" y="668" text-anchor="middle">User &amp; Auth Service</text>
    <text class="b-tech"  x="1095" y="686" text-anchor="middle">[Container: Python + Flask]</text>
    <text class="b-desc"  x="1095" y="708" text-anchor="middle">Registration, login (hashed</text>
    <text class="b-desc"  x="1095" y="722" text-anchor="middle">passwords), JWTs, profiles.</text>
  </g>

  <!-- ============ Data stores (cylinders) ============ -->
  <!-- Object Storage -->
  <g>
    <path d="M250 878 a120 18 0 0 1 240 0 v84 a120 18 0 0 1 -240 0 z" fill="#438dd5"/>
    <path d="M250 878 a120 18 0 0 0 240 0" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
    <text class="b-title" x="370" y="912" text-anchor="middle">Object Storage</text>
    <text class="b-tech"  x="370" y="930" text-anchor="middle">[S3-compatible]</text>
    <text class="b-desc"  x="370" y="950" text-anchor="middle">Uploaded note files (PDF/images)</text>
  </g>
  <!-- PostgreSQL -->
  <g>
    <path d="M620 878 a125 18 0 0 1 250 0 v84 a125 18 0 0 1 -250 0 z" fill="#438dd5"/>
    <path d="M620 878 a125 18 0 0 0 250 0" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
    <text class="b-title" x="745" y="912" text-anchor="middle">PostgreSQL Database</text>
    <text class="b-tech"  x="745" y="930" text-anchor="middle">[Relational DB]</text>
    <text class="b-desc"  x="745" y="950" text-anchor="middle">Users, note metadata, courses, credits</text>
  </g>

  <!-- ============ External system ============ -->
  <g>
    <rect x="1300" y="608" width="150" height="118" rx="10" fill="#6b6b6b"/>
    <text class="b-title" x="1375" y="646" text-anchor="middle" font-size="14">Email Service</text>
    <text class="b-desc"  x="1375" y="664" text-anchor="middle">[External]</text>
    <text class="b-desc"  x="1375" y="688" text-anchor="middle">
      <tspan x="1375">Verification &amp;</tspan>
      <tspan x="1375" dy="14">notification email</tspan>
    </text>
  </g>

  <!-- ============ legend ============ -->
  <g>
    <rect x="90" y="1028" width="900" height="70" rx="8" fill="#f6f8fa" stroke="#d7dee6"/>
    <text class="legend" x="108" y="1052" font-weight="700">Legend</text>

    <rect x="108" y="1066" width="18" height="14" rx="3" fill="#08427b"/>
    <text class="legend" x="132" y="1078">Person</text>

    <rect x="210" y="1066" width="18" height="14" rx="3" fill="#438dd5"/>
    <text class="legend" x="234" y="1078">Container (app / service)</text>

    <rect x="410" y="1066" width="18" height="14" rx="3" fill="#438dd5"/>
    <text class="legend" x="434" y="1078">Data store</text>

    <rect x="540" y="1066" width="18" height="14" rx="3" fill="#6b6b6b"/>
    <text class="legend" x="564" y="1078">External system</text>

    <rect x="700" y="1066" width="18" height="14" rx="3" fill="#f2f6fb" stroke="#5a7fa6" stroke-dasharray="4 3"/>
    <text class="legend" x="724" y="1078">System boundary</text>
  </g>
</svg>
